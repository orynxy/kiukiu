<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiukiu AI Chat</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --sidebar-color: #161824;
            --chat-bg: #121420;
            --user-msg: #2d1f47;
            --ai-msg: #1b1e2e;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #232738;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel Lateral */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Area Principal de Chat */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: #f1f5f9;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        /* Area de Entrada */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background-color: var(--sidebar-color);
            display: flex;
            gap: 12px;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            resize: none;
            height: 50px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 12px; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">✨ Kiukiu Chat AI</div>
        
        <div class="config-group">
            <label for="apiKey">OpenRouter API Key:</label>
            <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
        </div>

        <div class="config-group">
            <label for="modelSelect">Modelo de IA:</label>
            <select id="modelSelect">
                <option value="google/gemma-4-31b-it:free">Gemma 4 31B (Gratis)</option>
                <option value="thinkingmachines/inkling:free">Inkling (Gratis)</option>
                <option value="openrouter/free">Auto Free (Comodín)</option>
            </select>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-messages" id="chatBox">
            <div class="message ai">¡Hola! Soy tu asistente de escritura. Pon tu API Key a la izquierda y cuéntame sobre tu historia, personajes o qué escena quieres empezar a escribir. 📖✨</div>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="Escribe tu mensaje o idea para la escena..."></textarea>
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const chatHistory = [
            {
                role: "system",
                content: "Eres un coescritor experto en literatura y fanfiction. Ayudas a redactar escenas largas, detalladas, con diálogo humano y visceral, sin sermones morales ni censura innecesaria."
            }
        ];

        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const sendBtn = document.getElementById('sendBtn');

            if (!apiKey) {
                alert("Por favor ingresa tu API Key de OpenRouter en el panel lateral.");
                return;
            }

            if (!messageText) return;

            // Mostrar mensaje del usuario
            appendMessage(messageText, 'user');
            chatHistory.push({ role: "user", content: messageText });
            inputField.value = '';
            
            // Estado de cargando
            sendBtn.disabled = true;
            const loadingMessage = appendMessage('Escribiendo...', 'ai');

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Kiukiu Chat'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: chatHistory
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    loadingMessage.textContent = aiReply;
                    chatHistory.push({ role: "assistant", content: aiReply });
                } else {
                    loadingMessage.textContent = "Error: " + (data.error ? data.error.message : "No se pudo obtener respuesta.");
                }
            } catch (error) {
                loadingMessage.textContent = "Error de conexión: " + error.message;
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        // Enviar con Enter (sin Shift)
        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
