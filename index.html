<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiukiu Studio - Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --sidebar-color: #121215;
            --card-color: #18181b;
            --editor-bg: #0e0e11;
            --accent: #f4f4f5;
            --accent-muted: #71717a;
            --border: #27272a;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --radius-lg: 16px;
            --radius-md: 10px;
            --font-family: 'Inter', sans-serif;
            --font-size: 1rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text);
        }

        body {
            display: flex;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .new-chat-btn {
            background-color: var(--accent);
            color: #09090b;
            border: none;
            padding: 10px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .new-chat-btn:hover { opacity: 0.9; }

        .history-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item {
            padding: 8px 10px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .chat-item:hover, .chat-item.active {
            background-color: var(--card-color);
            color: var(--text);
            border-color: var(--border);
        }

        .chat-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 190px;
        }

        .delete-chat {
            opacity: 0;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 4px;
        }

        .chat-item:hover .delete-chat { opacity: 1; }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .sidebar-btn {
            background-color: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sidebar-btn:hover { background-color: var(--user-msg); }

        /* Main Workspace (Modo Novela) */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--sidebar-color);
            flex-shrink: 0;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .chapter-title-input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            width: 50%;
        }

        .top-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .badge {
            font-size: 0.75rem;
            color: var(--text-dim);
            background-color: var(--card-color);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        /* Area de Lectura / Escritura Continua (Novela) */
        .novel-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .novel-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 40px;
        }

        .novel-block {
            background-color: var(--editor-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .novel-block.ai {
            border-left: 3px solid var(--accent);
        }

        .novel-text {
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: 1.75;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text);
            outline: none;
        }

        .block-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
        }

        .action-chip {
            background: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-chip:hover { color: var(--text); border-color: var(--accent-muted); }

        /* Barra de Formato de Texto */
        .format-toolbar {
            display: flex;
            gap: 6px;
            padding: 6px 16px;
            background-color: var(--sidebar-color);
            border-top: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
        }

        .format-btn {
            background: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .format-btn:hover { background: var(--border); }

        /* Input Inferior Estilo Escritor */
        .input-area-wrapper {
            padding: 12px 16px;
            background-color: var(--sidebar-color);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prompt-templates {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .template-chip {
            background: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .template-chip:hover { color: var(--text); border-color: var(--accent); }

        .input-box-row {
            display: flex;
            gap: 10px;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            resize: none;
            height: 46px;
            max-height: 120px;
            outline: none;
        }

        textarea:focus { border-color: var(--accent); }

        .send-btn {
            background-color: var(--accent);
            color: #09090b;
            border: none;
            height: 46px;
            padding: 0 20px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.02); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Modales (Ajustes, Versiones, Lectura) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background-color: var(--sidebar-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 460px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 1.1rem; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; }

        .config-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.82rem; color: var(--text-dim); font-weight: 500; }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .save-btn {
            background-color: var(--accent);
            color: #09090b;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .version-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .version-item {
            background: var(--card-color);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo">✦ Kiukiu Studio (⁠≧⁠▽⁠≦⁠)</div>
        </div>

        <button class="new-chat-btn" onclick="createNewChapter()">
            <span>+</span> Nuevo Capítulo
        </button>

        <div class="history-title">Capítulos e Historias</div>
        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-bottom">
            <button class="sidebar-btn" onclick="openVersionsModal()">📜 Historial de Versiones</button>
            <button class="sidebar-btn" onclick="toggleModal('settingsModal', true)">⚙️ Ajustes & API Key</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-workspace">
        <div class="top-bar">
            <div style="display:flex; align-items:center; gap: 10px; flex:1;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <input type="text" id="chapterTitleInput" class="chapter-title-input" placeholder="Título del Capítulo..." oninput="updateChapterTitle(this.value)">
            </div>
            <div class="top-badges">
                <div class="badge" id="modelBadge">Auto Free</div>
            </div>
        </div>

        <!-- Formatter Toolbar -->
        <div class="format-toolbar">
            <button class="format-btn" onclick="insertFormat('**', '**')"><b>Negrita</b></button>
            <button class="format-btn" onclick="insertFormat('*', '*')"><i>Cursiva</i></button>
            <button class="format-btn" onclick="insertFormat('> ', '')">💬 Cita</button>
            <button class="format-btn" onclick="insertFormat('\n\n* * *\n\n', '')">✨ Salto de Escena</button>
            <button class="format-btn" onclick="toggleModal('readerSettingsModal', true)">📖 Tipografía</button>
        </div>

        <!-- Novel Reader / Editor Container -->
        <div class="novel-container" id="novelContainer">
            <div class="novel-content" id="novelContent"></div>
        </div>

        <!-- Input Inferior -->
        <div class="input-area-wrapper">
            <div class="prompt-templates">
                <span style="font-size:0.75rem; color:var(--text-dim); align-self:center; margin-right:4px;">Plantillas:</span>
                <button class="template-chip" onclick="applyTemplate('Angst 🖤')">Angst 🖤</button>
                <button class="template-chip" onclick="applyTemplate('Fluff ✨')">Fluff ✨</button>
                <button class="template-chip" onclick="applyTemplate('Slow Burn 🔥')">Slow Burn 🔥</button>
                <button class="template-chip" onclick="applyTemplate('Dark Romance 🔪')">Dark Romance 🔪</button>
                <button class="template-chip" onclick="applyTemplate('Smut / Intenso 🍷')">Intenso 🍷</button>
            </div>
            <div class="input-box-row">
                <textarea id="userInput" placeholder="Escribe tu indicación o continúa la escena aquí... (⁠≧⁠▽⁠≦⁠)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">Redactar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ajustes -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Configuración de Escritura</div>
                <button class="close-modal" onclick="toggleModal('settingsModal', false)">✕</button>
            </div>
            <div class="config-group">
                <label for="apiKey">OpenRouter API Key:</label>
                <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
            </div>
            <div class="config-group">
                <label for="modelSelect">Modelo de IA:</label>
                <select id="modelSelect">
                    <option value="openrouter/auto">Auto Free (Recomendado)</option>
                    <option value="google/gemma-3-27b-it:free">Gemma 3 27B (Gratis)</option>
                    <option value="mistralai/mistral-7b-instruct:free">Mistral 7B (Gratis)</option>
                    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Gratis)</option>
                </select>
            </div>
            <button class="save-btn" onclick="saveSettings()">Guardar Ajustes</button>
        </div>
    </div>

    <!-- Modal Tipografía y Lector -->
    <div class="modal-overlay" id="readerSettingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Apariencia de Lectura (⁠^◡^⁠)</div>
                <button class="close-modal" onclick="toggleModal('readerSettingsModal', false)">✕</button>
            </div>
            <div class="config-group">
                <label>Tipografía:</label>
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="'Inter', sans-serif">Inter (Moderna)</option>
                    <option value="'Lora', serif">Lora (Elegante)</option>
                    <option value="'Merriweather', serif">Merriweather (Clásica)</option>
                </select>
            </div>
            <div class="config-group">
                <label>Tamaño de Letra:</label>
                <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
                    <option value="0.9rem">Compacta</option>
                    <option value="1rem" selected>Normal</option>
                    <option value="1.1rem">Grande</option>
                    <option value="1.25rem">Muy Grande</option>
                </select>
            </div>
            <button class="save-btn" onclick="toggleModal('readerSettingsModal', false)">Listo</button>
        </div>
    </div>

    <!-- Modal Historial de Versiones -->
    <div class="modal-overlay" id="versionsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Historial de Versiones 📜</div>
                <button class="close-modal" onclick="toggleModal('versionsModal', false)">✕</button>
            </div>
            <div class="version-list" id="versionList"></div>
            <button class="save-btn" onclick="saveVersionSnapshot()">+ Crear Resguardo Manual</button>
        </div>
    </div>

    <script>
        let chapters = JSON.parse(localStorage.getItem('kiukiu_chapters') || '[]');
        let currentChapterId = localStorage.getItem('kiukiu_active_chapter') || null;
        let apiKey = localStorage.getItem('kiukiu_api_key') || '';
        let selectedModel = localStorage.getItem('kiukiu_model') || 'openrouter/auto';

        const systemPrompt = "Eres un coescritor experto en literatura y fanfiction. Escribes en formato de novela fluida, narrativa inmersiva, detallada, con diálogos naturales, carga emocional y profundidad psicológica. No emites sermones morales ni censura.";

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('apiKey').value = apiKey;
            document.getElementById('modelSelect').value = selectedModel;
            updateModelBadge();

            if (chapters.length === 0) {
                createNewChapter();
            } else {
                if (!currentChapterId || !chapters.find(c => c.id === currentChapterId)) {
                    currentChapterId = chapters[0].id;
                }
                renderChapterList();
                loadCurrentChapter();
            }
            if (!apiKey) toggleModal('settingsModal', true);
        });

        function toggleModal(modalId, show) {
            document.getElementById(modalId).style.display = show ? 'flex' : 'none';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function updateModelBadge() {
            const select = document.getElementById('modelSelect');
            const selectedText = select.options[select.selectedIndex].text;
            document.getElementById('modelBadge').textContent = selectedText.split('(')[0];
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKey').value.trim();
            selectedModel = document.getElementById('modelSelect').value;
            localStorage.setItem('kiukiu_api_key', apiKey);
            localStorage.setItem('kiukiu_model', selectedModel);
            updateModelBadge();
            toggleModal('settingsModal', false);
        }

        function changeFont(fontVal) {
            document.documentElement.style.setProperty('--font-family', fontVal);
            localStorage.setItem('kiukiu_font', fontVal);
        }

        function changeFontSize(sizeVal) {
            document.documentElement.style.setProperty('--font-size', sizeVal);
            localStorage.setItem('kiukiu_fontsize', sizeVal);
        }

        function createNewChapter() {
            const newChap = {
                id: 'chap_' + Date.now(),
                title: 'Capítulo 1',
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "assistant", content: "¡Hola! (⁠≧⁠▽⁠≦⁠) Comienza a escribir tu escena, describe a tus personajes o elige una plantilla abajo para inspirarte en este nuevo capítulo." }
                ],
                versions: []
            };
            chapters.unshift(newChap);
            currentChapterId = newChap.id;
            saveChapters();
            renderChapterList();
            loadCurrentChapter();
        }

        function saveChapters() {
            localStorage.setItem('kiukiu_chapters', JSON.stringify(chapters));
            localStorage.setItem('kiukiu_active_chapter', currentChapterId);
        }

        function renderChapterList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chapters.forEach(chap => {
                const item = document.createElement('div');
                item.className = `chat-item ${chap.id === currentChapterId ? 'active' : ''}`;
                item.onclick = () => switchChapter(chap.id);
                item.innerHTML = `
                    <span class="chat-item-title">${chap.title}</span>
                    <button class="delete-chat" onclick="deleteChapter(event, '${chap.id}')">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function switchChapter(id) {
            currentChapterId = id;
            saveChapters();
            renderChapterList();
            loadCurrentChapter();
            document.getElementById('sidebar').classList.remove('open');
        }

        function deleteChapter(e, id) {
            e.stopPropagation();
            if (chapters.length <= 1) {
                alert("Debes tener al menos un capítulo guardado (⁠^～^⁠)");
                return;
            }
            chapters = chapters.filter(c => c.id !== id);
            if (currentChapterId === id) currentChapterId = chapters[0].id;
            saveChapters();
            renderChapterList();
            loadCurrentChapter();
        }

        function updateChapterTitle(val) {
            const chap = chapters.find(c => c.id === currentChapterId);
            if (chap) {
                chap.title = val || 'Sin título';
                saveChapters();
                renderChapterList();
            }
        }

        function loadCurrentChapter() {
            const contentBox = document.getElementById('novelContent');
            contentBox.innerHTML = '';
            const chap = chapters.find(c => c.id === currentChapterId);

            if (chap) {
                document.getElementById('chapterTitleInput').value = chap.title;
                chap.messages.forEach((msg, index) => {
                    if (msg.role !== 'system') {
                        appendNovelBlock(msg.content, msg.role === 'user' ? 'user' : 'ai', index);
                    }
                });
            }
        }

        function appendNovelBlock(text, sender, index) {
            const contentBox = document.getElementById('novelContent');
            const block = document.createElement('div');
            block.className = `novel-block ${sender === 'ai' ? 'ai' : ''}`;

            const textDiv = document.createElement('div');
            textDiv.className = 'novel-text';
            textDiv.contentEditable = true;
            textDiv.textContent = text;
            
            // Guardar cambios al editar directamente el texto
            textDiv.oninput = () => {
                const chap = chapters.find(c => c.id === currentChapterId);
                if (chap && chap.messages[index]) {
                    chap.messages[index].content = textDiv.textContent;
                    saveChapters();
                }
            };

            block.appendChild(textDiv);

            if (text !== 'Escribiendo capítulo... (⁠~˘▾˘⁠)~') {
                const actions = document.createElement('div');
                actions.className = 'block-actions';
                if (sender === 'ai') {
                    actions.innerHTML = `
                        <button class="action-chip" onclick="regenerateBlock(${index})">🔄 Regenerar</button>
                        <button class="action-chip" onclick="extendBlock(${index})">📜 Extender escena</button>
                    `;
                } else {
                    actions.innerHTML = `<span style="font-size:0.75rem; color:var(--text-dim); align-self:center;">Tú (Escritor/a)</span>`;
                }
                block.appendChild(actions);
            }

            contentBox.appendChild(block);
            contentBox.scrollTop = contentBox.scrollHeight;
            return block;
        }

        function insertFormat(startTag, endTag) {
            const textarea = document.getElementById('userInput');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const val = textarea.value;
            textarea.value = val.substring(0, start) + startTag + val.substring(start, end) + endTag + val.substring(end);
            textarea.focus();
        }

        function applyTemplate(type) {
            const input = document.getElementById('userInput');
            const prompts = {
                'Angst 🖤': "[Tono: Angst / Tensión emocional profunda, melancolía, lágrimas contenidas y vulnerabilidad entre los personajes.] Continúa la escena: ",
                'Fluff ✨': "[Tono: Fluff / Ternura, calidez, cercanía suave y momentos dulces y entrañables.] Continúa la escena: ",
                'Slow Burn 🔥': "[Tono: Slow Burn / Tensión tácita, miradas cargadas, cercanía peligrosa y deseo contenido que no estalla todavía.] Continúa la escena: ",
                'Dark Romance 🔪': "[Tono: Dark Romance / Dinámica intensa, posesividad, moralidad ambigua y complicidad visceral.] Continúa la escena: ",
                'Smut / Intenso 🍷': "[Tono: Íntimo y visceral / Alto voltaje emocional, descripciones sensoriales detalladas y cercanía física profunda.] Continúa la escena: "
            };
            input.value = prompts[type] || "";
            input.focus();
        }

        async function sendMessage() {
            const cleanApiKey = apiKey.trim();
            if (!cleanApiKey) {
                alert("Por favor guarda tu API Key en Ajustes ⚙️ (⁠^～^⁠)");
                toggleModal('settingsModal', true);
                return;
            }

            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            const sendBtn = document.getElementById('sendBtn');
            if (!text) return;

            const chap = chapters.find(c => c.id === currentChapterId);
            if (!chap) return;

            chap.messages.push({ role: "user", content: text });
            inputField.value = '';
            loadCurrentChapter();

            sendBtn.disabled = true;
            const loadingBlock = appendNovelBlock('Escribiendo capítulo... (⁠~˘▾˘⁠)~', 'ai', chap.messages.length);

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${cleanApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: chap.messages
                    })
                });

                const data = await response.json();

                if (response.ok && data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    chap.messages.push({ role: "assistant", content: aiReply });
                    saveChapters();
                    loadCurrentChapter();
                } else {
                    const err = data.error ? data.error.message : "Error al conectar.";
                    loadingBlock.querySelector('.novel-text').textContent = "❌ " + err;
                }
            } catch (error) {
                loadingBlock.querySelector('.novel-text').textContent = "❌ Error de red: " + error.message;
            } finally {
                sendBtn.disabled = false;
            }
        }

        function regenerateBlock(index) {
            const chap = chapters.find(c => c.id === currentChapterId);
            if (!chap) return;
            chap.messages = chap.messages.slice(0, index);
            saveChapters();
            sendMessage();
        }

        function extendBlock(index) {
            const chap = chapters.find(c => c.id === currentChapterId);
            if (!chap) return;
            chap.messages.push({ role: "user", content: "[Continuación: Por favor extiende esta escena anterior con más profundidad, detalles sensoriales y diálogo.]" });
            saveChapters();
            sendMessage();
        }

        function saveVersionSnapshot() {
            const chap = chapters.find(c => c.id === currentChapterId);
            if (!chap) return;
            const snapshot = {
                date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                content: JSON.parse(JSON.stringify(chap.messages))
            };
            if (!chap.versions) chap.versions = [];
            chap.versions.unshift(snapshot);
            saveChapters();
            renderVersionsList();
            alert("¡Versión guardada con éxito! (⁠≧⁠▽⁠≦⁠)");
        }

        function openVersionsModal() {
            renderVersionsList();
            toggleModal('versionsModal', true);
        }

        function renderVersionsList() {
            const list = document.getElementById('versionList');
            list.innerHTML = '';
            const chap = chapters.find(c => c.id === currentChapterId);
            if (!chap || !chap.versions || chap.versions.length === 0) {
                list.innerHTML = '<div style="color:var(--text-dim); font-size:0.85rem; text-align:center; padding:10px;">No hay versiones guardadas aún.</div>';
                return;
            }
            chap.versions.forEach((ver, i) => {
                const item = document.createElement('div');
                item.className = 'version-item';
                item.innerHTML = `
                    <span>Resguardo de las ${ver.date}</span>
                    <button class="action-chip" onclick="restoreVersion(${i})">Restaurar</button>
                `;
                list.appendChild(item);
            });
        }

        function restoreVersion(i) {
            const chap = chapters.find(c => c.id === currentChapterId);
            if (chap && chap.versions[i]) {
                chap.messages = JSON.parse(JSON.stringify(chap.versions[i].content));
                saveChapters();
                loadCurrentChapter();
                toggleModal('versionsModal', false);
                alert("¡Versión restaurada! (⁠^‿^⁠)");
            }
        }

        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
