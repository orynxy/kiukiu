<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiukiu Studio Pro 📖✨</title>
    <!-- Importar fuentes tipográficas de alta calidad -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --sidebar-color: #121215;
            --card-color: #18181b;
            --editor-bg: #0d0d10;
            --accent: #f4f4f5;
            --accent-muted: #71717a;
            --border: #27272a;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --font-family: 'Inter', sans-serif;
            --font-size: 1rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text);
        }

        body {
            display: flex;
            position: relative;
        }

        /* Panel Lateral (Capítulos y Herramientas) */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #09090b;
            border: none;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 6px;
        }

        .chapter-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chapter-item {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .chapter-item:hover, .chapter-item.active {
            background-color: var(--card-color);
            color: var(--text);
            border-color: var(--border);
        }

        .chapter-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 190px;
        }

        .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 6px;
        }

        .chapter-item:hover .delete-btn { opacity: 1; }

        /* Plantillas de Prompt Rápidas */
        .templates-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .template-chip {
            background: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .template-chip:hover {
            color: var(--text);
            border-color: var(--accent-muted);
            background: var(--editor-bg);
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .settings-btn {
            background-color: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Área Principal de Escritura (Estudio / Novela) */
        .main-studio {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .top-bar {
            height: 56px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(8px);
            flex-shrink: 0;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .chapter-title-input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            width: 50%;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .tool-btn {
            background: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tool-btn:hover { background: var(--border); }

        /* Contenedor del Editor de Texto Pro */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            gap: 16px;
        }

        .story-textarea {
            flex: 1;
            background-color: var(--editor-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 24px;
            border-radius: var(--radius-lg);
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: 1.8;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.2);
            transition: border-color 0.2s;
        }

        .story-textarea:focus { border-color: var(--accent-muted); }

        /* Panel inferior de instrucciones para la IA */
        .ai-prompt-panel {
            background-color: var(--card-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ai-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ai-textarea {
            flex: 1;
            background: var(--editor-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            resize: none;
            height: 44px;
            outline: none;
        }

        .ai-textarea:focus { border-color: var(--accent-muted); }

        .generate-btn {
            background-color: var(--accent);
            color: #09090b;
            border: none;
            padding: 0 20px;
            height: 44px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
            white-space: nowrap;
        }

        .generate-btn:hover { transform: scale(1.02); }
        .generate-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        /* Modal de Configuración & Preferencias */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background-color: var(--sidebar-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 440px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 1.1rem; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; }

        .config-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; color: var(--text-dim); font-weight: 500; }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent); }

        /* Adaptación para Celulares y Tablets */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .editor-container { padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- Panel Lateral: Capítulos y Herramientas -->
    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo">✦ Kiukiu Studio Pro</div>
        </div>

        <button class="btn-primary" onclick="createNewChapter()">
            <span>+</span> Nuevo Capítulo
        </button>

        <div class="section-title">Plantillas de Trama</div>
        <div class="templates-box">
            <span class="template-chip" onclick="applyTemplate('Angst')">💔 Angst</span>
            <span class="template-chip" onclick="applyTemplate('Fluff')">🌸 Fluff</span>
            <span class="template-chip" onclick="applyTemplate('Slow Burn')">🔥 Slow Burn</span>
            <span class="template-chip" onclick="applyTemplate('Dark Romance')">🖤 Dark Romance</span>
        </div>

        <div class="section-title">Capítulos de la Historia</div>
        <div class="chapter-list" id="chapterList"></div>

        <div class="sidebar-footer">
            <button class="settings-btn" onclick="toggleVersionsModal(true)">📜 Historial Versiones</button>
            <button class="settings-btn" onclick="toggleSettingsModal(true)">⚙️ Ajustes & API Key</button>
        </div>
    </div>

    <!-- Estudio de Escritura Principal -->
    <div class="main-studio">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <input type="text" id="chapterTitleInput" class="chapter-title-input" value="Capítulo 1" oninput="updateChapterTitle(this.value)" />
            </div>
            
            <div class="toolbar">
                <button class="tool-btn" onclick="insertFormatting('**', '**')"><b>B</b></button>
                <button class="tool-btn" onclick="insertFormatting('*', '*')"><i>I</i></button>
                <button class="tool-btn" onclick="insertFormatting('\n\n* * *\n\n', '')">⁂ Escena</button>
                <button class="tool-btn" onclick="insertKaomoji()">(๑>◡<๑)</button>
            </div>
        </div>

        <div class="editor-container">
            <!-- Área de texto estilo novela -->
            <textarea id="storyEditor" class="story-textarea" placeholder="Escribe tu narrativa aquí o pídele a la IA que redacte la escena con una prosa profunda y visceral... (Soporta Markdown)" oninput="saveCurrentContent()"></textarea>

            <!-- Panel de instrucciones para continuar la escena -->
            <div class="ai-prompt-panel">
                <div class="ai-input-row">
                    <textarea id="aiPromptInput" class="ai-textarea" placeholder="Instrucción para la IA (Ej: Haz que la tensión entre ambos aumente con diálogos cortantes y miradas)..."></textarea>
                    <button class="generate-btn" id="sendBtn" onclick="generateStory()">Escribir ✨</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Ajustes -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Configuración de Escritura</div>
                <button class="close-modal" onclick="toggleSettingsModal(false)">✕</button>
            </div>

            <div class="config-group">
                <label for="apiKey">OpenRouter API Key:</label>
                <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
            </div>

            <div class="config-group">
                <label for="modelSelect">Modelo de IA:</label>
                <select id="modelSelect">
                    <option value="openrouter/auto">Auto Free (Recomendado)</option>
                    <option value="google/gemma-3-27b-it:free">Gemma 3 27B (Gratis)</option>
                    <option value="mistralai/mistral-7b-instruct:free">Mistral 7B (Gratis)</option>
                    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Gratis)</option>
                </select>
            </div>

            <div class="config-group">
                <label for="fontSelect">Tipografía:</label>
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="'Inter', sans-serif">Inter (Moderna Limpia)</option>
                    <option value="'Lora', serif">Lora (Novela Clásica)</option>
                    <option value="'Merriweather', serif">Merriweather (Literaria)</option>
                </select>
            </div>

            <div class="config-group">
                <label for="fontSizeRange">Tamaño de Letra:</label>
                <select id="fontSizeRange" onchange="changeFontSize(this.value)">
                    <option value="0.9rem">Compacta</option>
                    <option value="1rem" selected>Normal</option>
                    <option value="1.15rem">Amplia (Cómoda)</option>
                    <option value="1.3rem">Grande</option>
                </select>
            </div>

            <button class="btn-primary" onclick="saveSettings()">Guardar Ajustes</button>
        </div>
    </div>

    <!-- Modal de Historial de Versiones -->
    <div class="modal-overlay" id="versionsModal">
        <div class="modal" style="max-width: 500px; max-height: 80vh;">
            <div class="modal-header">
                <div class="modal-title">Historial de Versiones del Capítulo</div>
                <button class="close-modal" onclick="toggleVersionsModal(false)">✕</button>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-dim);">Cada vez que la IA redacta o guardas, se crea una instantánea de respaldo.</div>
            <div id="versionsList" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        // --- ESTADO DE LA APLICACIÓN ---
        let chapters = JSON.parse(localStorage.getItem('kiukiu_pro_chapters') || '[]');
        let currentChapterId = localStorage.getItem('kiukiu_pro_active') || null;
        let apiKey = localStorage.getItem('kiukiu_api_key') || '';
        let selectedModel = localStorage.getItem('kiukiu_model') || 'openrouter/auto';

        const kaomojis = ["(๑>◡<๑)", "( ˘ ³˘)♥", "(¬_¬ )", "(◡ ‿ ◡)", "(っ˘̩╭╮˘̩)っ", "(｡•́︿•̀｡)", "(๑˃ᴗ˂๑)", "(✧ω✧)"];
        
        const systemPrompt = "Eres un coescritor experto en literatura y fanfiction con un vocabulario sumamente rico, elocuente, sofisticado, visceral y literario. Evitas las palabras comunes o cliché, prefiriendo prosa profunda, sensorial y detallada. Escribes escenas intensas de romance, drama, angst o slow burn con absoluta libertad, sin sermones morales. Ocasionalmente puedes insertar kaomojis tiernos o expresivos en tu razonamiento interno o notas al margen (como (๑>◡<๑) o (¬_¬ )).";

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('apiKey').value = apiKey;
            document.getElementById('modelSelect').value = selectedModel;
            
            const savedFont = localStorage.getItem('kiukiu_font') || "'Inter', sans-serif";
            const savedSize = localStorage.getItem('kiukiu_fontsize") || "1rem";
            document.getElementById('fontSelect').value = savedFont;
            document.getElementById('fontSizeRange').value = savedSize;
            changeFont(savedFont);
            changeFontSize(savedSize);

            if (chapters.length === 0) {
                createNewChapter();
            } else {
                if (!currentChapterId || !chapters.find(c => c.id === currentChapterId)) {
                    currentChapterId = chapters[0].id;
                }
                renderChapterList();
                loadCurrentChapter();
            }

            if (!apiKey) toggleSettingsModal(true);
        });

        // --- GESTIÓN DE UI Y MODALES ---
        function toggleSettingsModal(show) { document.getElementById('settingsModal').style.display = show ? 'flex' : 'none'; }
        function toggleVersionsModal(show) { 
            if(show) renderVersionsList();
            document.getElementById('versionsModal').style.display = show ? 'flex' : 'none'; 
        }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function saveSettings() {
            apiKey = document.getElementById('apiKey').value.trim();
            selectedModel = document.getElementById('modelSelect').value;
            localStorage.setItem('kiukiu_api_key', apiKey);
            localStorage.setItem('kiukiu_model', selectedModel);
            toggleSettingsModal(false);
        }

        function changeFont(font) {
            document.documentElement.style.setProperty('--font-family', font);
            localStorage.setItem('kiukiu_font', font);
        }

        function changeFontSize(size) {
            document.documentElement.style.setProperty('--font-size', size);
            localStorage.setItem('kiukiu_fontsize', size);
        }

        // --- GESTIÓN DE CAPÍTULOS Y VERSIONES ---
        function createNewChapter() {
            const newChap = {
                id: 'chap_' + Date.now(),
                title: `Capítulo ${chapters.length + 1}`,
                content: "",
                versions: []
            };
            chapters.unshift(newChap);
            currentChapterId = newChap.id;
            saveChaptersToStorage();
            renderChapterList();
            loadCurrentChapter();
        }

        function saveChaptersToStorage() {
            localStorage.setItem('kiukiu_pro_chapters', JSON.stringify(chapters));
            localStorage.setItem('kiukiu_pro_active', currentChapterId);
        }

        function renderChapterList() {
            const list = document.getElementById('chapterList');
            list.innerHTML = '';
            chapters.forEach(chap => {
                const item = document.createElement('div');
                item.className = `chapter-item ${chap.id === currentChapterId ? 'active' : ''}`;
                item.onclick = () => switchChapter(chap.id);
                item.innerHTML = `
                    <span class="chapter-title-text">${chap.title}</span>
                    <button class="delete-btn" onclick="deleteChapter(event, '${chap.id}')">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function switchChapter(id) {
            currentChapterId = id;
            saveChaptersToStorage();
            renderChapterList();
            loadCurrentChapter();
            document.getElementById('sidebar').classList.remove('open');
        }

        function deleteChapter(e, id) {
            e.stopPropagation();
            if (chapters.length <= 1) {
                alert("Debes conservar al menos un capítulo.");
                return;
            }
            chapters = chapters.filter(c => c.id !== id);
            if (currentChapterId === id) currentChapterId = chapters[0].id;
            saveChaptersToStorage();
            renderChapterList();
            loadCurrentChapter();
        }

        function updateChapterTitle(val) {
            const current = chapters.find(c => c.id === currentChapterId);
            if (current) {
                current.title = val || "Sin título";
                saveChaptersToStorage();
                renderChapterList();
            }
        }

        function loadCurrentChapter() {
            const current = chapters.find(c => c.id === currentChapterId);
            if (current) {
                document.getElementById('chapterTitleInput').value = current.title;
                document.getElementById('storyEditor').value = current.content;
            }
        }

        function saveCurrentContent() {
            const current = chapters.find(c => c.id === currentChapterId);
            if (current) {
                current.content = document.getElementById('storyEditor').value;
                saveChaptersToStorage();
            }
        }

        function saveSnapshot(content) {
            const current = chapters.find(c => c.id === currentChapterId);
            if (current) {
                if(!current.versions) current.versions = [];
                current.versions.unshift({
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    text: content
                });
                if(current.versions.length > 10) current.versions.pop(); // Máximo 10 versiones
                saveChaptersToStorage();
            }
        }

        function renderVersionsList() {
            const list = document.getElementById('versionsList');
            list.innerHTML = '';
            const current = chapters.find(c => c.id === currentChapterId);
            if (!current || !current.versions || current.versions.length === 0) {
                list.innerHTML = '<div style="color: var(--text-dim); padding: 10px;">Aún no hay versiones guardadas para este capítulo.</div>';
                return;
            }
            current.versions.forEach((ver, idx) => {
                const item = document.createElement('div');
                item.style.cssText = "background: var(--editor-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px;";
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--accent-muted);">
                        <span>Versión a las ${ver.date}</span>
                        <button onclick="restoreVersion(${idx})" style="background: var(--card-color); border: 1px solid var(--border); color: var(--text); padding: 2px 8px; border-radius: 4px; cursor: pointer;">Restaurar</button>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${ver.text.slice(0, 100)}...</div>
                `;
                list.appendChild(item);
            });
        }

        function restoreVersion(idx) {
            const current = chapters.find(c => c.id === currentChapterId);
            if (current && current.versions[idx]) {
                document.getElementById('storyEditor').value = current.versions[idx].text;
                saveCurrentContent();
                toggleVersionsModal(false);
            }
        }

        // --- HERRAMIENTAS DE EDICIÓN Y FORMATO ---
        function insertFormatting(wrapperBefore, wrapperAfter) {
            const textarea = document.getElementById('storyEditor');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selectedText = text.substring(start, end);

            textarea.value = text.substring(0, start) + wrapperBefore + selectedText + wrapperAfter + text.substring(end);
            textarea.selectionStart = start + wrapperBefore.length;
            textarea.selectionEnd = end + wrapperBefore.length;
            textarea.focus();
            saveCurrentContent();
        }

        function insertKaomoji() {
            const randomKao = kaomojis[Math.floor(Math.random() * kaomojis.length)];
            insertFormatting(randomKao, ' ');
        }

        function applyTemplate(type) {
            const input = document.getElementById('aiPromptInput');
            if (type === 'Angst') {
                input.value = "Escribe una escena cargada de angst, dolor emocional retenido, miradas que queman y un diálogo visceral e hiriente entre ambos personajes (con kaomoji expresivo).";
            } else if (type === 'Fluff') {
                input.value = "Escribe una escena suave, cálida y tierna (fluff), llena de pequeños detalles físicos reconfortantes, sonrojos y complicidad.";
            } else if (type === 'Slow Burn') {
                input.value = "Escribe una escena de slow burn puro: tensión palpable, cercanía peligrosa que se interrumpe en el último segundo, electricidad en el ambiente.";
            } else if (type === 'Dark Romance') {
                input.value = "Escribe una escena de dark romance intensa, posesiva, con una atmósfera oscura, gótica y magnética.";
            }
            input.focus();
        }

        // --- CONEXIÓN CON OPENROUTER IA ---
        async function generateStory() {
            const cleanApiKey = apiKey.trim();
            if (!cleanApiKey) {
                alert("Por favor guarda tu API Key de OpenRouter en Ajustes ⚙️");
                toggleSettingsModal(true);
                return;
            }

            const promptInput = document.getElementById('aiPromptInput');
            const instruction = promptInput.value.trim();
            const editor = document.getElementById('storyEditor');
            const sendBtn = document.getElementById('sendBtn');

            if (!instruction) {
                alert("Escribe una instrucción para que la IA sepa qué redactar.");
                return;
            }

            saveSnapshot(editor.value); // Guardar versión antes de la magia

            const currentText = editor.value;
            const fullContext = [
                { role: "system", content: systemPrompt },
                { role: "user", content: `Historia actual:\n${currentText}\n\nInstrucción de continuación: ${instruction}` }
            ];

            sendBtn.disabled = true;
            sendBtn.textContent = "Redactando (๑>◡<๑)...";

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${cleanApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: fullContext
                    })
                });

                const data = await response.json();

                if (response.ok && data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    
                    // Añadir la respuesta de la IA de forma limpia al final del editor
                    editor.value = currentText + (currentText.endsWith('\n') ? '' : '\n\n') + aiReply;
                    saveCurrentContent();
                    saveSnapshot(editor.value); // Guardar nueva versión con la respuesta
                    promptInput.value = '';
                } else {
                    const errorMsg = data.error ? data.error.message : "Error desconocido en OpenRouter.";
                    alert("❌ " + errorMsg);
                }
            } catch (error) {
                alert("❌ Error de red: " + error.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Escribir ✨";
            }
        }

        document.getElementById('aiPromptInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateStory();
            }
        });
    </script>
