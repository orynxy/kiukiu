<!DOCTYPE html>
<html lang="es" data-theme="dark" data-font="Lora">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiukiu Studio — Fanfic Edition</title>
    <!-- Google Fonts para Lora, Merriweather e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --sidebar-color: #121215;
            --card-color: #18181b;
            --text-color: #f4f4f5;
            --text-dim: #a1a1aa;
            --border-color: #27272a;
            --accent: #f4f4f5;
            --accent-hover: #e4e4e7;
            --user-bg: #1c1c21;
            --radius-pill: 9999px;
            --radius-lg: 24px;
            --radius-md: 16px;
            --font-family: 'Lora', serif;
            --font-size: 1.05rem;
        }

        [data-theme="light"] {
            --bg-color: #fafafa;
            --sidebar-color: #f0f0f2;
            --card-color: #ffffff;
            --text-color: #18181b;
            --text-dim: #71717a;
            --border-color: #e4e4e7;
            --accent: #18181b;
            --accent-hover: #27272a;
            --user-bg: #f4f4f5;
        }

        [data-font="Inter"] { --font-family: 'Inter', sans-serif; }
        [data-font="Lora"] { --font-family: 'Lora', serif; }
        [data-font="Merriweather"] { --font-family: 'Merriweather', serif; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size);
        }

        body {
            display: flex;
            position: relative;
        }

        /* Sidebar Estética Circular */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 14px 20px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .new-chat-btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-item {
            padding: 12px 16px;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .chat-item:hover, .chat-item.active {
            background-color: var(--card-color);
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .chat-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .delete-chat {
            opacity: 0;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
        }

        .chat-item:hover .delete-chat { opacity: 1; }

        .settings-btn {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 20px;
            border-radius: var(--radius-pill);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .settings-btn:hover { background-color: var(--border-color); }

        /* Main Workspace (Modo Novela/Fanfic) */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            height: 64px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .model-badge {
            font-size: 0.82rem;
            color: var(--text-dim);
            background-color: var(--card-color);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-color);
        }

        /* Contenedor tipo manuscrito / lectura */
        .fanfic-stream {
            flex: 1;
            padding: 30px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .story-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-block.user {
            align-self: flex-end;
            max-width: 85%;
        }

        .story-block.ai {
            align-self: stretch;
            max-width: 100%;
        }

        .user-bubble {
            background-color: var(--user-bg);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: var(--radius-lg);
            border-bottom-right-radius: 6px;
            line-height: 1.6;
        }

        .ai-prose {
            line-height: 1.8;
            padding: 0 10px;
            color: var(--text-color);
        }

        .ai-prose p { margin-bottom: 1em; }
        .ai-prose strong { font-weight: 600; }
        .ai-prose em { font-style: italic; }

        /* Accciones flotantes */
        .block-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            padding-left: 10px;
        }

        .story-block:hover .block-actions { opacity: 1; }

        .action-chip {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-chip:hover {
            color: var(--text-color);
            border-color: var(--accent);
        }

        /* Animación Escribiendo Estética */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: var(--card-color);
            border-radius: var(--radius-pill);
            width: fit-content;
            border: 1px solid var(--border-color);
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Tropes Chips rápidos */
        .tropes-bar {
            display: flex;
            gap: 8px;
            padding: 8px 20px;
            overflow-x: auto;
            background-color: var(--bg-color);
            white-space: nowrap;
            scrollbar-width: none;
        }
        .tropes-bar::-webkit-scrollbar { display: none; }

        .trope-chip {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .trope-chip:hover {
            color: var(--text-color);
            border-color: var(--accent);
            background-color: var(--user-bg);
        }

        /* Barra de Entrada de Escritura */
        .input-wrapper {
            padding: 12px 20px 24px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px 12px 8px 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 8px 0;
            font-size: 0.95rem;
            resize: none;
            height: 44px;
            max-height: 140px;
            outline: none;
        }

        .send-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.05); }

        /* Modal Ajustes ultra estético */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background-color: var(--sidebar-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 460px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 1.2rem; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; }

        .setting-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; color: var(--text-dim); font-weight: 500; }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 16px;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            outline: none;
        }

        .save-settings-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 14px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .story-block.user { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo">✦ Kiukiu Studio</div>
        </div>

        <button class="new-chat-btn" onclick="createNewChat()">
            <span>+</span> Nuevo Capítulo / Historia
        </button>

        <div class="section-title">Historial de Capítulos</div>
        <div class="chat-list" id="chatList"></div>

        <button class="settings-btn" onclick="toggleModal(true)">
            ⚙️ Ajustes & Estética
        </button>
    </div>

    <!-- Workspace Principal -->
    <div class="main-workspace">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="model-badge" id="modelBadge">Auto Free</div>
        </div>

        <!-- Transmisión de Lectura / Fanfic -->
        <div class="fanfic-stream" id="chatBox"></div>

        <!-- Barra de Tropes Rápidos -->
        <div class="tropes-bar">
            <div class="trope-chip" onclick="insertTrope('🔥 Dark Romance visceral, tensión y diálogos cortantes.')">🔥 Dark Romance</div>
            <div class="trope-chip" onclick="insertTrope('⏳ Slow burn intenso, miradas robadas y toque de angst.')">⏳ Slow Burn</div>
            <div class="trope-chip" onclick="insertTrope('☁️ Fluff reconfortante, calidez y momentos suaves.')">☁️ Fluff</div>
            <div class="trope-chip" onclick="insertTrope('🌧️ Angst profundo, vulnerabilidad y drama emocional.')">🌧️ Angst</div>
            <div class="trope-chip" onclick="insertTrope('✨ Enemies to lovers con chispa e ironía.')">✨ Enemies to Lovers</div>
        </div>

        <!-- Entrada de Texto -->
        <div class="input-wrapper">
            <div class="input-container">
                <textarea id="userInput" placeholder="Escribe tu indicación o continúa la escena... (shift + enter para salto)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <!-- Modal de Ajustes -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Ajustes & Personalización</div>
                <button class="close-modal" onclick="toggleModal(false)">✕</button>
            </div>

            <div class="setting-group">
                <label for="apiKeyInput">OpenRouter API Key:</label>
                <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." />
            </div>

            <div class="setting-group">
                <label for="modelSelect">Modelo de IA:</label>
                <select id="modelSelect">
                    <option value="openrouter/auto">Auto Free (Recomendado)</option>
                    <option value="google/gemma-3-27b-it:free">Gemma 3 27B (Excelente prosa)</option>
                    <option value="mistralai/mistral-7b-instruct:free">Mistral 7B</option>
                    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="themeSelect">Tema Visual:</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Negro Gótico (Dark)</option>
                    <option value="light">Blanco Papel (Light)</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="fontSelect">Tipografía Literaria:</label>
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="Lora">Lora (Elegante & Clásica)</option>
                    <option value="Merriweather">Merriweather (Lectura profunda)</option>
                    <option value="Inter">Inter (Moderna & Limpia)</option>
                </select>
            </div>

            <button class="save-settings-btn" onclick="saveSettings()">Guardar Cambios</button>
        </div>
    </div>

    <script>
        let chats = JSON.parse(localStorage.getItem('kiukiu_fanfic_chats') || '[]');
        let currentChatId = localStorage.getItem('kiukiu_active_id') || null;
        let apiKey = localStorage.getItem('kiukiu_api_key') || '';
        let selectedModel = localStorage.getItem('kiukiu_model') || 'openrouter/auto';
        let currentTheme = localStorage.getItem('kiukiu_theme') || 'dark';
        let currentFont = localStorage.getItem('kiukiu_font') || 'Lora';

        const systemPrompt = "Eres un coescritor experto en literatura y fanfiction con un vocabulario sumamente amplio, rico, visceral y elocuente. Evitas clichés repetitivos y usas descripciones profundas, sensoriales y diálogos humanos muy cuidados. En tus intervenciones casuales o comentarios fuera de la prosa usas kaomojis tiernos como (｡•̀ᴗ-)✧ o (⁠◍⁠•⁠ᴗ⁠•⁠◍⁠). No aplicas censura moral innecesaria y te adaptas al tono oscuro, romántico o dramático que solicite el usuario.";

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('modelSelect').value = selectedModel;
            document.getElementById('themeSelect').value = currentTheme;
            document.getElementById('fontSelect').value = currentFont;
            
            applyTheme(currentTheme);
            applyFont(currentFont);
            updateBadge();

            if (chats.length === 0) {
                createNewChat();
            } else {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                renderChatList();
                loadCurrentChat();
            }

            if (!apiKey) toggleModal(true);
        });

        function toggleModal(show) { document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function changeTheme(theme) {
            currentTheme = theme;
            applyTheme(theme);
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        function changeFont(font) {
            currentFont = font;
            applyFont(font);
        }
        function applyFont(font) {
            document.documentElement.setAttribute('data-font', font);
        }

        function updateBadge() {
            const select = document.getElementById('modelSelect');
            document.getElementById('modelBadge').textContent = select.options[select.selectedIndex].text.split('(')[0];
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            selectedModel = document.getElementById('modelSelect').value;
            localStorage.setItem('kiukiu_api_key', apiKey);
            localStorage.setItem('kiukiu_model', selectedModel);
            localStorage.setItem('kiukiu_theme', currentTheme);
            localStorage.setItem('kiukiu_font', currentFont);
            updateBadge();
            toggleModal(false);
        }

        function createNewChat() {
            const newChat = {
                id: 'fic_' + Date.now(),
                title: 'Nuevo Capítulo',
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "assistant", content: "¡Hola, hola! (｡•̀ᴗ-)✧ Estoy lista para tejer nuestra historia. Cuéntame qué trama exploraremos hoy o qué personaje tomará la iniciativa en esta escena... 📖✨" }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadCurrentChat();
        }

        function saveChats() {
            localStorage.setItem('kiukiu_fanfic_chats', JSON.stringify(chats));
            localStorage.setItem('kiukiu_active_id', currentChatId);
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(chat.id);
                item.innerHTML = `
                    <span class="chat-item-title">${chat.title}</span>
                    <button class="delete-chat" onclick="deleteChat(event, '${chat.id}')">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            saveChats();
            renderChatList();
            loadCurrentChat();
            document.getElementById('sidebar').classList.remove('open');
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if (chats.length <= 1) { alert("Debes conservar al menos un capítulo."); return; }
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) currentChatId = chats[0].id;
            saveChats();
            renderChatList();
            loadCurrentChat();
        }

        function loadCurrentChat() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            const currentChat = chats.find(c => c.id === currentChatId);
            if (currentChat) {
                currentChat.messages.forEach((msg, idx) => {
                    if (msg.role !== 'system') {
                        appendBlockUI(msg.content, msg.role === 'user' ? 'user' : 'ai', idx);
                    }
                });
            }
        }

        function insertTrope(tropeText) {
            const input = document.getElementById('userInput');
            input.value = tropeText + " " + input.value;
            input.focus();
        }

        async function sendMessage(textOverride = null) {
            const cleanKey = apiKey.trim();
            if (!cleanKey) { alert("Ingresa tu API Key en ajustes ⚙️"); toggleModal(true); return; }

            const input = document.getElementById('userInput');
            const text = textOverride || input.value.trim();
            if (!text) return;

            const currentChat = chats.find(c => c.id === currentChatId);
            if (!currentChat) return;

            if (!textOverride) {
                if (currentChat.messages.filter(m => m.role !== 'system').length <= 1) {
                    currentChat.title = text.slice(0, 22) + (text.length > 22 ? '...' : '');
                    renderChatList();
                }
                currentChat.messages.push({ role: "user", content: text });
                input.value = '';
            }

            loadCurrentChat();

            const chatBox = document.getElementById('chatBox');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'story-block ai';
            loadingDiv.innerHTML = `
                <div class="ai-prose">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cleanKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: selectedModel, messages: currentChat.messages })
                });

                const data = await response.json();
                if (response.ok && data.choices && data.choices[0]) {
                    let aiReply = data.choices[0].message.content;
                    currentChat.messages.push({ role: "assistant", content: aiReply });
                    saveChats();
                    loadCurrentChat();
                } else {
                    loadingDiv.querySelector('.ai-prose').textContent = "❌ " + (data.error?.message || "Error al conectar.");
                }
            } catch (err) {
                loadingDiv.querySelector('.ai-prose').textContent = "❌ Error de red: " + err.message;
            }
        }

        function formatMarkdown(text) {
            // Conversión básica y limpia de Markdown a HTML para prosa rica
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function appendBlockUI(text, sender, index) {
            const chatBox = document.getElementById('chatBox');
            const block = document.createElement('div');
            block.className = `story-block ${sender}`;

            if (sender === 'user') {
                block.innerHTML = `
                    <div class="user-bubble">${escapeHtml(text)}</div>
                    <div class="block-actions">
                        <button class="action-chip" onclick="editUserMsg(${index})">✏️ Editar</button>
                    </div>
                `;
            } else {
                block.innerHTML = `
                    <div class="ai-prose">${formatMarkdown(text)}</div>
                    <div class="block-actions">
                        <button class="action-chip" onclick="regenerateAI(${index})">🔄 Reintentar</button>
                        <button class="action-chip" onclick="expandAI(${index})">📜 Extender escena</button>
                    </div>
                `;
            }
            chatBox.appendChild(block);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function editUserMsg(index) {
            const chat = chats.find(c => c.id === currentChatId);
            const newText = prompt("Edita tu indicación:", chat.messages[index].content);
            if (newText !== null && newText.trim() !== "") {
                chat.messages[index].content = newText.trim();
                chat.messages = chat.messages.slice(0, index + 1);
                saveChats();
                sendMessage(newText.trim());
            }
        }

        function regenerateAI(index) {
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages = chat.messages.slice(0, index);
            saveChats();
            sendMessage("Continúa la escena con otra variante narrativa más intensa.");
        }

        function expandAI(index) {
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages = chat.messages.slice(0, index + 1);
            chat.messages.push({ role: "user", content: "[Instrucción: Profundiza más en esta escena, añade detalles sensoriales, diálogo interno y expande la prosa significativamente]." });
            saveChats();
            sendMessage("Extiende");
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById('userInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
    </html>
