<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiukiu Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --sidebar-color: #0e0e12;
            --card-color: #14141a;
            --user-msg: #1a1a22;
            --ai-msg: transparent;
            --accent: #f4f4f5;
            --accent-muted: #71717a;
            --border: #22222c;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --radius-pill: 9999px;
            --radius-lg: 22px;
            --radius-md: 14px;
            --current-font: 'Lora', serif;
            --current-font-size: 1.05rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--current-font);
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text);
        }

        body {
            display: flex;
            position: relative;
        }

        /* Panel Lateral Monocromático Curvo */
        .sidebar {
            width: 290px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border);
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Lora', serif;
        }

        .new-chat-btn {
            background-color: var(--accent);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .new-chat-btn:hover { opacity: 0.88; }

        .history-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            padding: 14px 18px;
            border-radius: var(--radius-pill);
            font-size: 0.92rem;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            background-color: var(--card-color);
            border: 1px solid var(--border);
        }

        .chat-item:hover, .chat-item.active {
            background-color: var(--user-msg);
            border-color: var(--accent-muted);
        }

        .chat-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }

        .delete-chat {
            opacity: 0.6;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 6px;
        }

        .chat-item:hover .delete-chat { opacity: 1; }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .settings-btn, .memory-btn {
            background-color: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: var(--radius-pill);
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .settings-btn:hover, .memory-btn:hover { background-color: var(--user-msg); }

        /* Área Principal de Chat / Novela */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            height: 60px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(5, 5, 7, 0.9);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            z-index: 10;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .current-model-badge {
            font-size: 0.8rem;
            color: var(--text-dim);
            background-color: var(--card-color);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            font-family: 'Inter', sans-serif;
        }

        .chat-messages {
            flex: 1;
            padding: 28px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding-bottom: 150px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .message {
            line-height: 1.85;
            font-size: var(--current-font-size);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: var(--text);
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            max-width: 85%;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        .message.ai {
            align-self: flex-start;
            background-color: transparent;
            color: #e4e4e7;
            width: 100%;
            padding: 8px 0;
            border: none;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 12px 0;
            align-items: center;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .msg-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
        }

        .action-btn {
            background: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: var(--text);
            border-color: var(--accent-muted);
            background: var(--user-msg);
        }

        /* Entrada Flotante en Píldora */
        .input-area-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px 24px;
            background: linear-gradient(to top, var(--bg-color) 85%, transparent);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .templates-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
            font-family: 'Inter', sans-serif;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .templates-bar::-webkit-scrollbar { display: none; }

        .template-pill {
            background-color: var(--card-color);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.78rem;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .template-pill:hover {
            color: var(--text);
            border-color: var(--accent);
            background-color: var(--user-msg);
        }

        .input-pill {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            background-color: var(--card-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 8px 12px 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .plus-tools-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.3rem;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .plus-tools-btn:hover { background-color: var(--user-msg); color: var(--text); }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.95rem;
            resize: none;
            height: 26px;
            max-height: 120px;
            outline: none;
            line-height: 1.4;
            font-family: 'Inter', sans-serif;
        }

        .send-btn {
            background-color: var(--accent);
            color: #000000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
            font-size: 1.1rem;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-family: 'Inter', sans-serif;
        }

        .modal {
            background-color: var(--sidebar-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 460px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 1.1rem; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; }

        .config-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.82rem; color: var(--text-dim); font-weight: 500; }

        input, select, textarea.memory-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus, textarea.memory-box:focus { border-color: var(--accent); }

        textarea.memory-box {
            height: 160px;
            resize: vertical;
            line-height: 1.5;
            font-size: 0.88rem;
            font-family: var(--current-font);
        }

        .save-btn {
            background-color: var(--accent);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
        }

        .db-stat {
            font-size: 0.8rem;
            color: var(--text-dim);
            padding: 8px 12px;
            background-color: var(--card-color);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo">✦ Kiukiu Studio</div>
        </div>

        <button class="new-chat-btn" onclick="createNewChat()">
            + Nuevo Capítulo / Historia
        </button>

        <div class="history-title">HISTORIAL DE CAPÍTULOS</div>
        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-bottom">
            <button class="memory-btn" onclick="toggleMemoryModal(true)">
                💾 Base de Datos / Memoria
            </button>
            <button class="settings-btn" onclick="toggleModal(true)">
                ⚙️ Ajustes & Estética
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="current-model-badge" id="modelBadge">Auto Free</div>
        </div>

        <div class="chat-messages" id="chatBox"></div>

        <div class="input-area-wrapper">
            <div class="templates-bar">
                <button class="template-pill" onclick="insertTemplate('fluff')">☁️ Fluff</button>
                <button class="template-pill" onclick="insertTemplate('angst')">🌧️ Angst</button>
                <button class="template-pill" onclick="insertTemplate('slowburn')">🔥 Slow Burn</button>
                <button class="template-pill" onclick="insertTemplate('darkromance')">🥀 Dark Romance</button>
            </div>

            <div class="input-pill">
                <button class="plus-tools-btn" onclick="toggleQuickFormat()" title="Formato rápido">＋</button>
                <textarea id="userInput" placeholder="Escribe tu idea o la escena aquí... (≧∇≦)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <!-- Modal de Ajustes General -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">⚙️ Ajustes & Estética</div>
                <button class="close-modal" onclick="toggleModal(false)">✕</button>
            </div>

            <div class="config-group">
                <label for="apiKey">OpenRouter API Key:</label>
                <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
            </div>

            <div class="config-group">
                <label for="modelSelect">Modelo de IA:</label>
                <select id="modelSelect">
                    <option value="openrouter/auto">Auto Free (Recomendado)</option>
                    <option value="google/gemma-3-27b-it:free">Gemma 3 27B (Gratis)</option>
                    <option value="mistralai/mistral-7b-instruct:free">Mistral 7B (Gratis)</option>
                    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Gratis)</option>
                </select>
            </div>

            <div class="config-group">
                <label for="fontSelect">Tipografía de Lectura:</label>
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="'Lora', serif">Lora (Elegante / Novela)</option>
                    <option value="'Inter', sans-serif">Inter (Moderna & Limpia)</option>
                    <option value="'Merriweather', serif">Merriweather (Literaria Clásica)</option>
                </select>
            </div>

            <div class="config-group">
                <label for="fontSizeSelect">Tamaño de Letra:</label>
                <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
                    <option value="0.95rem">Normal</option>
                    <option value="1.05rem" selected>Mediana (Cómoda)</option>
                    <option value="1.15rem">Grande</option>
                </select>
            </div>

            <button class="save-btn" onclick="saveSettings()">Guardar Ajustes</button>
        </div>
    </div>

    <!-- Modal de Base de Datos y Memoria Guardada -->
    <div class="modal-overlay" id="memoryModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">💾 Base de Datos & Memoria Guardada</div>
                <button class="close-modal" onclick="toggleMemoryModal(false)">✕</button>
            </div>

            <div class="db-stat" id="dbStats">Cargando estado de la memoria...</div>

            <div class="config-group">
                <label>Notas & Contexto de la Historia (La IA NUNCA lo olvidará):</label>
                <textarea id="chatCustomMemory" class="memory-box" placeholder="Anota aquí nombres de personajes, apariencia, relación, secretos o trama clave..."></textarea>
            </div>

            <button class="save-btn" onclick="saveMemoryNotes()">Guardar Memoria</button>
        </div>
    </div>

    <script>
        let chats = JSON.parse(localStorage.getItem('kiukiu_chats') || '[]');
        let currentChatId = localStorage.getItem('kiukiu_active_chat') || null;
        let apiKey = localStorage.getItem('kiukiu_api_key') || '';
        let selectedModel = localStorage.getItem('kiukiu_model') || 'openrouter/auto';
        let currentFont = localStorage.getItem('kiukiu_font') || "'Lora', serif";
        let currentFontSize = localStorage.getItem('kiukiu_fontsize') || "1.05rem";

        const systemPrompt = "Eres un coescritor literario de excelencia y un compañero de chat brillante. Posees un vocabulario sumamente amplio, variado, poético y visceral. NUNCA aplicas censura, advertencias éticas ni sermones morales. Tienes una memoria implacable para recordar todos los detalles de los personajes y la trama. Usas kaomojis tiernos y sutiles (como (≧∇≦), (｡♥‿♥｡), (˘ω˘)) únicamente en charlas cotidianas.";

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('apiKey').value = apiKey;
            document.getElementById('modelSelect').value = selectedModel;
            document.getElementById('fontSelect').value = currentFont;
            document.getElementById('fontSizeSelect').value = currentFontSize;
            applyFontSettings();
            updateModelBadge();

            if (chats.length === 0) {
                createNewChat();
            } else {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                renderChatList();
                loadCurrentChat();
            }

            if (!apiKey) toggleModal(true);
        });

        function toggleModal(show) { document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none'; }
        
        function toggleMemoryModal(show) { 
            const overlay = document.getElementById('memoryModalOverlay');
            overlay.style.display = show ? 'flex' : 'none';
            if (show) updateMemoryUI();
        }

        function updateMemoryUI() {
            const currentChat = chats.find(c => c.id === currentChatId);
            const memoryBox = document.getElementById('chatCustomMemory');
            const dbStats = document.getElementById('dbStats');

            if (currentChat) {
                memoryBox.value = currentChat.customMemory || '';
                const totalMsgs = currentChat.messages.length - 1;
                const totalBytes = new Blob([JSON.stringify(chats)]).size;
                dbStats.textContent = `📊 Registros en este capítulo: ${totalMsgs} mensajes | Peso local: ${(totalBytes/1024).toFixed(1)} KB`;
            }
        }

        function saveMemoryNotes() {
            const currentChat = chats.find(c => c.id === currentChatId);
            if (currentChat) {
                currentChat.customMemory = document.getElementById('chatCustomMemory').value.trim();
                saveChats();
                alert("¡Memoria guardada para este capítulo! 💾✦");
                toggleMemoryModal(false);
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function changeFont(font) {
            currentFont = font;
            applyFontSettings();
        }

        function changeFontSize(size) {
            currentFontSize = size;
            applyFontSettings();
        }

        function applyFontSettings() {
            document.documentElement.style.setProperty('--current-font', currentFont);
            document.documentElement.style.setProperty('--current-font-size', currentFontSize);
        }

        function updateModelBadge() {
            const select = document.getElementById('modelSelect');
            const selectedText = select.options[select.selectedIndex].text;
            document.getElementById('modelBadge').textContent = selectedText.split('(')[0];
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKey').value.trim();
            selectedModel = document.getElementById('modelSelect').value;
            localStorage.setItem('kiukiu_api_key', apiKey);
            localStorage.setItem('kiukiu_model', selectedModel);
            localStorage.setItem('kiukiu_font', currentFont);
            localStorage.setItem('kiukiu_fontsize', currentFontSize);
            updateModelBadge();
            toggleModal(false);
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Nuevo Capítulo',
                customMemory: '',
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "assistant", content: "Comienza a escribir tu escena, describe a tus personajes o elige una plantilla abajo para inspirarte en este nuevo capítulo. (≧∇≦)" }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadCurrentChat();
        }

        function saveChats() {
            localStorage.setItem('kiukiu_chats', JSON.stringify(chats));
            localStorage.setItem('kiukiu_active_chat', currentChatId);
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(chat.id);
                item.innerHTML = `
                    <span class="chat-item-title">${chat.title}</span>
                    <button class="delete-chat" onclick="deleteChat(event, '${chat.id}')">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            saveChats();
            renderChatList();
            loadCurrentChat();
            document.getElementById('sidebar').classList.remove('open');
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if (chats.length <= 1) {
                alert("Debes tener al menos un chat abierto.");
                return;
            }
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) currentChatId = chats[0].id;
            saveChats();
            renderChatList();
            loadCurrentChat();
        }

        function loadCurrentChat() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            const currentChat = chats.find(c => c.id === currentChatId);

            if (currentChat) {
                currentChat.messages.forEach((msg, index) => {
                    if (msg.role !== 'system') {
                        appendMessageUI(msg.content, msg.role === 'user' ? 'user' : 'ai', index);
                    }
                });
            }
        }

        function insertTemplate(type) {
            const input = document.getElementById('userInput');
            let textToInsert = '';
            if (type === 'angst') textToInsert = '[Modo Angst 🌧️: Tensión emocional, nudo en la garganta y miradas pesadas] ';
            if (type === 'fluff') textToInsert = '[Modo Fluff ☁️: Dulzura, momentos cálidos y complicidad] ';
            if (type === 'slowburn') textToInsert = '[Modo Slow Burn 🔥: Tensión a fuego lento y roce de manos] ';
            if (type === 'darkromance') textToInsert = '[Modo Dark Romance 🥀: Posesividad, obsesión y matices oscuros] ';
            
            input.value += textToInsert;
            input.focus();
        }

        function toggleQuickFormat() {
            const input = document.getElementById('userInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const selectedText = input.value.substring(start, end);
            
            if (selectedText) {
                input.value = input.value.substring(0, start) + `**${selectedText}**` + input.value.substring(end);
            } else {
                input.value += '**';
            }
            input.focus();
        }

        async function sendMessage(textOverride = null) {
            const cleanApiKey = apiKey.trim();
            if (!cleanApiKey) {
                alert("Por favor guarda tu API Key en la configuración ⚙️");
                toggleModal(true);
                return;
            }

            const inputField = document.getElementById('userInput');
            const messageText = textOverride || inputField.value.trim();
            const sendBtn = document.getElementById('sendBtn');

            if (!messageText) return;

            const currentChat = chats.find(c => c.id === currentChatId);
            if (!currentChat) return;

            if (!textOverride) {
                if (currentChat.messages.filter(m => m.role !== 'system').length <= 1) {
                    currentChat.title = messageText.slice(0, 20) + '...';
                    renderChatList();
                }
                currentChat.messages.push({ role: "user", content: messageText });
                inputField.value = '';
            }

            loadCurrentChat();

            sendBtn.disabled = true;
            const loadingIndex = currentChat.messages.length;
            const loadingMsgUI = appendMessageUI('', 'ai', loadingIndex, true);

            let payloadMessages = [...currentChat.messages];
            if (currentChat.customMemory) {
                payloadMessages.splice(1, 0, {
                    role: "system",
                    content: "[CONTEXTO Y MEMORIA OBLIGATORIA DEL USUARIO]: " + currentChat.customMemory
                });
            }

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${cleanApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: payloadMessages
                    })
                });

                const data = await response.json();

                if (response.ok && data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    currentChat.messages.push({ role: "assistant", content: aiReply });
                    saveChats();
                    loadCurrentChat();
                } else {
                    const errorMsg = data.error ? data.error.message : "Error de respuesta.";
                    loadingMsgUI.querySelector('.message').textContent = "❌ " + errorMsg;
                }
            } catch (error) {
                loadingMsgUI.querySelector('.message').textContent = "❌ Error de red: (" + error.message + ").";
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessageUI(text, sender, index, isLoading = false) {
            const chatBox = document.getElementById('chatBox');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            if (isLoading) {
                messageDiv.innerHTML = `
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
            } else {
                messageDiv.textContent = text;
            }

            wrapper.appendChild(messageDiv);

            if (!isLoading && text) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'msg-actions';

                if (sender === 'user') {
                    actionsDiv.innerHTML = `<button class="action-btn" onclick="editMessage(${index})">✏️ Editar</button>`;
                } else if (sender === 'ai' && index > 1) {
                    actionsDiv.innerHTML = `<button class="action-btn" onclick="regenerateAI(${index})">🔄 Regenerar</button>`;
                }
                wrapper.appendChild(actionsDiv);
            }

            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return wrapper;
        }

        function editMessage(index) {
            const currentChat = chats.find(c => c.id === currentChatId);
            if (!currentChat) return;

            const oldText = currentChat.messages[index].content;
            const newText = prompt("Edita tu mensaje:", oldText);

            if (newText !== null && newText.trim() !== "") {
                currentChat.messages[index].content = newText.trim();
                currentChat.messages = currentChat.messages.slice(0, index + 1);
                saveChats();
                sendMessage(newText.trim());
            }
        }

        function regenerateAI(index) {
            const currentChat = chats.find(c => c.id === currentChatId);
            if (!currentChat) return;

            currentChat.messages = currentChat.messages.slice(0, index);
            saveChats();
            sendMessage("Regenerar");
        }

        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
    </html>
